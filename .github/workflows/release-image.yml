name: Release image

# Publishes the app image for every release, for both Intel and ARM hosts, to
# ghcr.io/<owner>/<repo>. An installation then upgrades with
#
#   docker compose pull app && docker compose up -d app
#
# instead of building on the host — which on a Raspberry Pi, or emulated on
# an Intel Mac, takes most of half an hour. The image comes from the tagged
# commit in a clean checkout, so it is exactly what the release names.

on:
  push:
    tags: ["v*.*.*"]
  # A manual run publishes the branch it was started from, tagged with the
  # branch and commit, never as a version or as latest.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same check CI runs: the builder copies the whole checkout, and
      # a published image is the hardest leak to take back.
      - name: No personal data in the build context
        run: ./scripts/check-no-personal-figures.sh --build-context

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2.7.0, 2.7 and latest for a release; the commit always. The version
      # and revision labels are what `docker inspect` reads to say what runs.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
