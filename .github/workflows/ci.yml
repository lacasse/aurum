name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The EODHD free plan allows 20 calls a day for the whole account, so CI must
# never spend one. No test calls the provider, and pinning the cap to zero means
# a future one still could not: every call site reserves against this limit
# first and a zero limit refuses every reservation.
env:
  EODHD_DAY_LIMIT: "0"
  # Twelve Data allows 8 credits a minute and 800 a day for the whole account.
  # CI must never spend one: no test calls the provider, and pinning the caps to
  # zero means a future one still could not, since every call site reserves
  # against these limits first and a zero limit refuses every reservation.
  TWELVEDATA_MINUTE_LIMIT: "0"
  TWELVEDATA_DAY_LIMIT: "0"

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security regression check
        run: npm run check:security

      - name: Unit tests
        run: npm test

      - name: CSV parser tests
        run: npm run test:csv

      - name: Build
        # The app refuses to start without these; API routes are force-dynamic
        # so the build itself never reads them, but next build loads the modules.
        env:
          AUTH_USERNAME: ci
          AUTH_PASSWORD: ci-build-only-not-a-real-password
          AUTH_SECRET: ci-build-only-not-a-real-secret
        run: npm run build

  database:
    name: Database integration (migrations + repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Boots an embedded PostgreSQL, applies every migration in drizzle/ and
      # exercises the repository layer, so a bad migration fails CI.
      - name: Integration tests
        run: npm run test:db

  smoke:
    name: API smoke test (real server + PostgreSQL)
    runs-on: ubuntu-latest

    # Exercises the seam unit tests and the repository tests both miss: a real
    # HTTP request, through a route handler, against a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://aurum:aurum@127.0.0.1:5432/aurum
      AUTH_USERNAME: ci
      AUTH_PASSWORD: ci-smoke-only-not-a-real-password
      AUTH_SECRET: ci-smoke-only-not-a-real-secret
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Started detached; the smoke script polls until the server answers. No
      # EODHD_API_KEY is set and the cap is pinned to 0, so nothing can reach
      # the provider even if a code path tried.
      - name: Start the app
        run: npm start > server.log 2>&1 &

      - name: Smoke test
        run: npm run test:smoke

      # The assertions report which check failed; the server log says why.
      - name: Server log on failure
        if: failure()
        run: cat server.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
